<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>{{ page.title | escape }} · devnest</title>
<style>
body{margin:0;background:#f6f8fb;color:#202b3b;font:16px/1.8 system-ui,-apple-system,sans-serif}
main{max-width:860px;margin:36px auto;padding:32px;background:#fff;border:1px solid #e2e7ee;border-radius:16px}
h1,h2{line-height:1.4}h1{font-size:1.8rem}h2{font-size:1.25rem;margin-top:2rem}
a{color:#185caa;overflow-wrap:anywhere}blockquote{margin:20px 0;padding:12px 18px;background:#fff4da;border-left:4px solid #b98016}
table{width:100%;border-collapse:collapse}td,th{padding:10px;border:1px solid #dce2ea;text-align:left}
code{overflow-wrap:anywhere}nav{font-size:.9rem}footer{margin-top:36px;color:#586579}
@media(max-width:600px){main{margin:0;padding:22px;border:0;border-radius:0}table{font-size:.88rem}}
</style>
</head>
<body><main><nav><a href="{{ '/' | relative_url }}">devnest 정책 문서</a></nav>
{{ content }}
<footer>© devnest</footer></main></body></html>
