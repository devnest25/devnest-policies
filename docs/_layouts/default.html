<!doctype html>
<html lang="{{ page.lang | default: site.lang | default: 'ko' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>{{ page.title | escape }} · DevNest</title>
<link rel="icon" type="image/svg+xml" href="{{ '/assets/brand/app-icon.svg' | relative_url }}">
<meta name="theme-color" content="#100D1B">
<style>
body{margin:0;background:#F5F1FF;color:#100D1B;font:16px/1.8 system-ui,-apple-system,sans-serif}
main{max-width:860px;margin:36px auto;padding:32px;background:#fff;border:1px solid #e2e7ee;border-radius:16px}
h1,h2{line-height:1.4}h1{font-size:1.8rem}h2{font-size:1.25rem;margin-top:2rem}
a{color:#6832AF;overflow-wrap:anywhere}blockquote{margin:20px 0;padding:12px 18px;background:#fff4da;border-left:4px solid #b98016}
table{width:100%;border-collapse:collapse}td,th{overflow-wrap:anywhere;padding:10px;border:1px solid #dce2ea;text-align:left}
code{overflow-wrap:anywhere}nav{font-size:.9rem}footer{margin-top:36px;color:#586579}
@media(max-width:600px){main{margin:0;padding:22px;border:0;border-radius:0}table{font-size:.88rem}}
.brand-link{display:inline-flex;max-width:100%;margin-bottom:16px}.brand-logo{display:block;width:220px;max-width:100%;height:auto}a:focus-visible{outline:3px solid #9B5CFF;outline-offset:4px}
</style>
</head>
<body><main><a class="brand-link" href="{{ '/' | relative_url }}" aria-label="DevNest"><img class="brand-logo" src="{{ '/assets/brand/logo-horizontal-color-light.svg' | relative_url }}" alt="DevNest" width="220" height="48"></a><nav><a href="{{ '/' | relative_url }}">{% if page.lang == 'en' %}DevNest policies{% else %}DevNest 정책 문서{% endif %}</a></nav>
{{ content }}
<footer>© DevNest</footer></main></body></html>
